<body>
<div class="rp-wrap">
  <div class="rp-logo"><a class="logo" href="/"><span class="studs"><i></i><i></i><i></i><i></i></span>BrickGains</a></div>
  <div class="rp-card">
    <h1>Choose a new password</h1>
    <p>Enter a new password for your account. At least 8 characters.</p>
    <form id="rpForm" onsubmit="return doReset(event)">
      <input id="rpNew" type="password" placeholder="New password" autocomplete="new-password" minlength="8" required>
      <input id="rpNew2" type="password" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
      <button class="btn" type="submit">Update password</button>
      <div id="rpMsg" class="rp-msg"></div>
    </form>
  </div>
</div>
<script>
function qp(k){return new URLSearchParams(location.search).get(k)||'';}
async function doReset(e){
  e.preventDefault();
  var m=document.getElementById('rpMsg'); m.className='rp-msg';
  var a=document.getElementById('rpNew').value, b=document.getElementById('rpNew2').value;
  var token=qp('token');
  if(!token){ m.className='rp-msg err'; m.textContent='Missing reset link. Request a new one from the login screen.'; return false; }
  if(a!==b){ m.className='rp-msg err'; m.textContent='Passwords do not match.'; return false; }
  m.textContent='…';
  try{
    var r=await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,new_password:a})});
    var d=await r.json().catch(function(){return {};});
    if(d.ok){ m.className='rp-msg ok'; m.textContent='Password updated. Redirecting to sign in…'; setTimeout(function(){location.href='/app';},1500); }
    else { m.className='rp-msg err'; m.textContent=d.error||'Something went wrong.'; }
  }catch(err){ m.className='rp-msg err'; m.textContent='Network error. Try again.'; }
  return false;
}
</script>
