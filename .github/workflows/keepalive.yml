name: Keep-alive (prevent Render cold-start)

# Render free spins the service down after ~15 min of inactivity, which causes a
# 10-30s cold start on the next request. This pings the site so it stays warm.
# Repo is public -> Actions minutes are free.

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (GitHub may delay/batch schedules)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BrickGains a few times (covers cron gaps)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://brickgains.com/ || echo fail)
            echo "ping $i -> $code"
            if [ "$i" -lt 3 ]; then sleep 90; fi
          done
